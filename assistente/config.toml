# OpenJarvis — configuração do assistente do Diogo.
# O instalar.ps1 copia isto para %USERPROFILE%\.openjarvis\config.toml
# e preenche __CHAT_ID__. Os segredos ficam em variáveis de ambiente
# (ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN), nunca neste ficheiro.

[engine]
default = "cloud"

[intelligence]
provider = "anthropic"
default_model = "claude-sonnet-5-5"
fallback_model = "claude-haiku-5-5"
temperature = 0.4

[agent]
default_agent = "orchestrator"
max_turns = 10
tools = "think,memory_manage,user_profile_manage,memory_store,memory_search,web_search,skill_manage,calendar_upcoming,calendar_search"
context_from_memory = true

[channel]
enabled = true
default_channel = "telegram"
default_agent = "orchestrator"

[channel.telegram]
# bot_token vem de TELEGRAM_BOT_TOKEN
allowed_chat_ids = "__CHAT_ID__"   # só o Diogo pode falar com o bot
parse_mode = "Markdown"

[server]
host = "127.0.0.1"   # não expor na rede
